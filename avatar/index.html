<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IRIS — Campus AI Assistant</title>
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self';
                 script-src 'self' https://cdn.jsdelivr.net https://fonts.cdnfonts.com 'unsafe-inline';
                 style-src  'self' https://fonts.cdnfonts.com 'unsafe-inline';
                 font-src   https://fonts.cdnfonts.com data:;
                 connect-src 'self' blob: ws://localhost:8080 wss://localhost:8443;
                 img-src 'self' data: blob:;
                 worker-src blob:;">
  <link rel="icon" type="image/png" href="./icon.png">
  <link href="https://fonts.cdnfonts.com/css/hahmlet" rel="stylesheet">
  <link rel="stylesheet" href="./css/kiosk.css">
</head>
<body>

<div class="bg"></div>
<div class="bg-overlay"></div>

<div class="kiosk">

  <!-- ── TOP BAR ── -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="school-seal">
        <img src="./logo.png" alt="Logo">
      </div>
      <div class="topbar-divider"></div>
      <div class="school-seal">
        <img src="./icon.png" alt="Icon">
      </div>
      <div class="school-info">
        <div class="school-name">IRIS</div>
        <div class="school-tagline">Intelligent Retrieval-Augmented Institutional Support Bot</div>
      </div>
    </div>

    <div class="topbar-center"></div>

    <div class="topbar-right">
      <button class="tap-speak-btn" id="tapSpeakBtn" onclick="toggleTapToSpeak()">
        <div class="tap-speak-dot"></div>
        <span id="tapSpeakLabel">Enable Microphone</span>
      </button>
    </div>
  </div>

  <!-- ── MAIN ── -->
  <div class="main">

    <!-- AVATAR -->
    <div class="avatar-col">
      <canvas id="vrm-canvas"></canvas>
      <div id="vrm-loading">
        <div class="vrm-spinner"></div>
        <div class="vrm-loading-text">Loading model...</div>
      </div>
      <!-- Listening ring -->
      <div class="avatar-listen-ring" id="avatarListenRing"></div>
      <!-- Listening label -->
      <div class="avatar-listen-label" id="avatarListenLabel">
        <div class="listen-bars">
          <div class="l-bar"></div>
          <div class="l-bar"></div>
          <div class="l-bar"></div>
          <div class="l-bar"></div>
          <div class="l-bar"></div>
        </div>
        <span class="listen-label-text">Listening</span>
        <div class="listen-bars">
          <div class="l-bar"></div>
          <div class="l-bar"></div>
          <div class="l-bar"></div>
          <div class="l-bar"></div>
          <div class="l-bar"></div>
        </div>
      </div>
      <div class="avatar-label">
        <div class="avatar-label-name">Iris</div>
        <div class="avatar-label-tag">AI Campus Assistant</div>
      </div>
    </div>

    <!-- CONVERSATION -->
    <div class="conv-col">
      <div class="bubble-section">
        <div class="bubble-label">Conversation</div>

        <!-- USER MESSAGE -->
        <div class="user-bubble" id="userBubble" style="display:none;">
          <div class="user-bubble-header">
            <div class="user-avatar-pill">U</div>
            <div class="user-name">You</div>
          </div>
          <div class="user-bubble-body" id="userText"></div>
        </div>

        <!-- AI RESPONSE -->
        <div class="speech-bubble">
          <div class="bubble-ai-header">
            <div class="ai-avatar-pill">A</div>
            <div class="ai-title-wrap">
              <div class="ai-name">Iris</div>
              <div class="ai-subtitle">Hello Red Spartans!</div>
            </div>
            <div class="typing-indicator" id="typingInd" style="display:none">
              <div class="t-dot"></div>
              <div class="t-dot"></div>
              <div class="t-dot"></div>
              <span>Processing</span>
            </div>
          </div>
          <div class="bubble-body" id="aiText"></div>
          <div class="wake-prompt" id="wakePrompt">
            Microphone is active. Say the wake word to ask a question.
            <strong>"Hey Iris"</strong>
            <div class="wake-prompt-dots">
              <div class="wp-dot"></div>
              <div class="wp-dot"></div>
              <div class="wp-dot"></div>
            </div>
          </div>
          <!-- QR Code panel — shown when response contains a URL -->
          <div class="qr-panel" id="qrPanel" style="display:none;">
            <div class="qr-label">Scan to open</div>
            <div id="qrCode"></div>
            <div class="qr-url" id="qrUrl"></div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <!-- ── BOTTOM BAR ── -->
  <div class="bottombar">
    <div class="bb-left">Queries today: <strong id="qCount">0</strong></div>
  </div>

</div>

<!-- DEV ONLY — remove before deployment -->
<div id="dev-anim-btn">
  <label id="dev-fbx-label">
    <input type="file" accept=".fbx" id="dev-fbx-input">
    🎬 Load FBX [Dev]
  </label>
  <div id="dev-anim-label">no animation loaded</div>
</div>
<!-- END DEV BLOCK -->

<script type="importmap">
{
  "imports": {
    "three":            "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
    "three/addons/":    "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
    "@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
  }
}
</script>

<script>
  /* ── Tap to Speak ── */
  var tapActive = false;
  function toggleTapToSpeak() {
    tapActive = !tapActive;
    var prompt = document.getElementById('wakePrompt');
    var aiText = document.getElementById('aiText');

    if (tapActive) {
      // Trigger mic permission dialog on first tap
      if (window._audioMgr) window._audioMgr.init();
      // Tell main.js to switch to listening state
      if (typeof setAvatarState === 'function') setAvatarState('listening');
      if (!aiText.textContent.trim() && prompt) prompt.style.display = 'block';
    } else {
      if (typeof setAvatarState === 'function') setAvatarState('idle');
      if (prompt) prompt.style.display = 'none';
    }
  }

  /* Auto-hide wake prompt when AI responds */
  var aiTextEl = document.getElementById('aiText');
  if (aiTextEl) {
    new MutationObserver(function () {
      if (aiTextEl.textContent.trim()) {
        var p = document.getElementById('wakePrompt');
        if (p) p.style.display = 'none';
      }
    }).observe(aiTextEl, { childList: true, subtree: true, characterData: true });
  }

  /* ── User query bubble ── */
  window.setUserQuery = function (text) {
    var bubble   = document.getElementById('userBubble');
    var userText = document.getElementById('userText');
    if (!text || !text.trim()) return;
    userText.textContent = text.trim();
    bubble.style.display = 'block';
    var p = document.getElementById('wakePrompt');
    if (p) p.style.display = 'none';
  };
  document.addEventListener('userQuery', function (e) {
    if (e.detail && e.detail.text) window.setUserQuery(e.detail.text);
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
  .qr-panel {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px;
    border-top: 1px solid var(--light, #e0e0e0);
    background: var(--surface, #f5f5f5);
    flex-shrink: 0;
  }
  .qr-label {
    font-family: var(--font, serif);
    font-size: clamp(9px, 1vw, 11px);
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--muted, #555);
  }
  #qrCode canvas {
    border: 4px solid #fff;
    border-radius: 4px;
  }
  .qr-url {
    font-family: monospace;
    font-size: clamp(10px, 1.1vw, 12px);
    color: var(--blue, #191970);
    word-break: break-all;
    text-align: center;
    max-width: 220px;
  }
</style>

<script type="module" src="./js/main.js"></script>
</body>
</html>
